# Blueprint de Render: un solo servicio web (API + frontend) y una base PostgreSQL.
#
# Úsalo para crear un despliegue NUEVO: Render > New > Blueprint > elige este repositorio.
# Si ya tienes servicios funcionando en Render, no necesitas aplicarlo: sigue la sección
# "Actualizar un despliegue existente" del README (así conservas tu base de datos actual).

databases:
  - name: sistema-auxiliares-db
    plan: free
    region: virginia
    databaseName: sistema_auxiliares
    user: sistema_user

services:
  - type: web
    name: sistema-auxiliares
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm run render-build
    startCommand: npm start
    # Responde aunque la base esté reiniciándose, para que Render no reinicie el servicio en cadena.
    # El diagnóstico completo (base de datos + notificaciones) está en /api/health
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-auxiliares-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Cuenta de administrador que se crea en el primer arranque (Render las pedirá al aplicar)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
