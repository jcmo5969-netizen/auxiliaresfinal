<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sistema de Auxiliares</title>
    <meta name="description" content="Solicitudes de auxiliar del Hospital de Quilpué, con avisos al celular." />
    <meta name="theme-color" content="#0369a1" />

    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="/logo-hospital-quilpue.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iPhone / iPad: app en la pantalla de inicio (requisito para recibir notificaciones) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Auxiliares" />

    <!-- HashRouter: una sola redirección para iOS/Safari (evitar pantalla en blanco) -->
    <script>
      (function() {
        var path = window.location.pathname || '/';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        // Ya tenemos hash de ruta (ej. #/ o #/auxiliar/acceso) -> no tocar
        if (hash.length > 1 && hash.indexOf('#/') === 0) return;
        // Ruta con path (ej. /auxiliar/acceso) sin hash -> ir a #/auxiliar/acceso
        if (path !== '/' && path !== '/index.html') {
          window.location.replace('/#' + path + search);
          return;
        }
        // Raíz sin hash -> ir a #/ para que React arranque
        if (hash === '' || hash === '#') window.location.replace('#/');
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#6b7280;font-size:0.875rem;" id="root-fallback">Cargando…</div>
    </div>
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
